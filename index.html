<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="סימולציה אינטראקטיבית ובהירה של שלבי המיטוזה והמיוזה">
  <title>מיטוזה ומיוזה — סימולציה אינטראקטיבית</title>
  <style>
    :root{--ink:#172033;--muted:#536176;--line:#cbd5e1;--paper:#fff;--wash:#f3f7fb;--blue:#155eef;--blue2:#e8f0ff;--purple:#7c3aed;--orange:#ea580c;--green:#15803d;--red:#dc2626;--shadow:0 12px 35px rgba(30,41,59,.10)}
    *{box-sizing:border-box} body{margin:0;background:linear-gradient(145deg,#eef5ff,#fafcff 42%,#eefbf7);color:var(--ink);font-family:Arial,"Noto Sans Hebrew",sans-serif;line-height:1.5}
    button{font:inherit;color:inherit} .app{width:min(1500px,100%);margin:auto;padding:24px}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:18px}.top h1{font-size:clamp(1.55rem,3vw,2.35rem);margin:0 0 4px}.top p{font-size:1.05rem;color:var(--muted);margin:0}.mode{display:flex;gap:8px;background:#fff;border:1px solid var(--line);padding:5px;border-radius:14px;box-shadow:var(--shadow)}
    .mode button,.nav button,.chip{min-height:46px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 18px;font-weight:700;cursor:pointer}.mode button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px}.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.main{padding:18px;min-width:0}.stage-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.counter{color:var(--muted);font-weight:700}.stage-title{font-size:clamp(1.35rem,2.4vw,2rem);font-weight:800}.ploidy{background:#f8fafc;border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:700;white-space:nowrap}
    .canvas{direction:ltr;overflow:auto;background:var(--wash);border:1px solid #dbe4ef;border-radius:14px}.canvas svg{display:block;width:100%;height:auto;min-width:850px}.explain{margin-top:14px;padding:14px 16px;background:#f8fafc;border:1px solid #dbe4ef;border-radius:12px;font-size:1.12rem}.side{display:flex;flex-direction:column;gap:14px}.side .card{padding:16px}.side h2{font-size:1.15rem;margin:0 0 10px}.components{display:grid;gap:7px}.chip{text-align:right;width:100%;min-height:42px;padding:7px 12px;font-weight:600}.chip:hover,.chip:focus-visible,.chip.active{border-color:var(--blue);background:var(--blue2);outline:none}.selected-name{font-size:1.12rem;font-weight:800}.selected-desc{color:var(--muted);margin-top:5px}.nav{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;margin-top:18px}.nav button:disabled{opacity:.4;cursor:not-allowed}.dots{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}.dot{width:15px;height:15px;border:1px solid #94a3b8;border-radius:50%;padding:0;min-height:0;cursor:pointer;background:#fff}.dot.active{background:var(--blue);border-color:var(--blue)}
    svg .cell{fill:#fff;stroke:#475569;stroke-width:4}svg .nucleus{fill:#f8fafc;stroke:#64748b;stroke-width:3;stroke-dasharray:10 7}svg .chrA{stroke:var(--purple)}svg .chrB{stroke:var(--orange)}svg .chr{stroke-width:12;stroke-linecap:round}.centromere{fill:#172033}.pole{fill:var(--green);stroke:#14532d;stroke-width:2}.fiber{stroke:#2563eb;stroke-width:3;opacity:.72}.plate{stroke:#64748b;stroke-width:3;stroke-dasharray:9 8}.pointer{stroke:#111827;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.label{font:bold 19px Arial;fill:#111827;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}.clickable{cursor:pointer}.clickable:hover{filter:drop-shadow(0 0 5px #60a5fa)}.legend{font:16px Arial;fill:#475569}
    .footer{text-align:center;color:var(--muted);font-size:.9rem;padding:15px 0 2px}@media(max-width:950px){.layout{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr}.top{flex-direction:column}.app{padding:14px}.mode{align-self:stretch}.mode button{flex:1}}@media(max-width:600px){.side{grid-template-columns:1fr}.stage-head{align-items:flex-start;flex-direction:column}.nav{grid-template-columns:1fr 1fr}.dots{grid-column:1/-1;grid-row:1}.nav button{width:100%}}
  </style>
</head>
<body>
<main class="app">
  <header class="top"><div><h1>סימולציה גדולה ובהירה של מיטוזה ומיוזה</h1><p>עברו שלב־שלב ולחצו על רכיב בתרשים או ברשימה כדי להבין את תפקידו.</p></div><div class="mode" role="group" aria-label="סוג החלוקה"><button id="mitosis" aria-pressed="true">מיטוזה</button><button id="meiosis" aria-pressed="false">מיוזה</button></div></header>
  <section class="layout"><article class="card main"><div class="stage-head"><div><div id="counter" class="counter"></div><div id="stage" class="stage-title"></div></div><div id="ploidy" class="ploidy"></div></div><div class="canvas"><svg id="diagram" viewBox="0 0 1100 620" role="img" aria-labelledby="svgTitle svgDesc"><title id="svgTitle">תרשים חלוקת תא</title><desc id="svgDesc">המחשה סכמטית של הכרומוזומים, הכישור ורכיבים נוספים לאורך שלבי החלוקה.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#111827"/></marker></defs></svg></div><div id="explain" class="explain"></div></article>
    <aside class="side"><section class="card"><h2>רכיבים בשלב הזה</h2><div id="components" class="components"></div></section><section class="card" aria-live="polite"><h2>הרכיב הנבחר</h2><div id="selectedName" class="selected-name">—</div><div id="selectedDesc" class="selected-desc">לחצו על אחד הרכיבים.</div></section></aside></section>
  <nav class="nav" aria-label="ניווט בין שלבים"><button id="prev">→ הקודם</button><div id="dots" class="dots"></div><button id="next">הבא ←</button></nav><div class="footer">התרשים סכמטי ונועד ללמידה; הגדלים והמרחקים אינם בקנה מידה.</div>
</main>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s),svg=$('#diagram'),NS='http://www.w3.org/2000/svg';
const info={cell:['ממברנת התא','הגבול החיצוני של התא. בזמן ציטוקינזה התא עצמו מתחלק.'],nucleus:['מעטפת הגרעין','עוטפת את הכרומוזומים. בתחילת החלוקה היא מתפרקת ובהמשך נוצרת מחדש.'],chromosome:['כרומוזום משוכפל','כרומוזום לאחר שלב S, המכיל שתי כרומטידות אחיות.'],chromatid:['כרומטידה אחות','אחד משני העותקים הזהים של כרומוזום לאחר שכפול ה־DNA.'],centromere:['צנטרומר','האזור בכרומוזום שבו הכרומטידות האחיות מחוברות.'],kinetochore:['קינטוכור','קומפלקס חלבוני באזור הצנטרומר שאליו מתחברים מיקרוטובולי הכישור.'],centrosome:['צנטרוזום','מרכז ארגון המיקרוטובולים הנמצא ליד כל קוטב של התא.'],microtubule:['מיקרוטובול','סיב שלד תא הבנוי מטובולין. יחד, הסיבים יוצרים את כישור החלוקה.'],spindle:['כישור החלוקה','מערכת המיקרוטובולים שמארגנת ומפרידה את הכרומוזומים.'],homolog:['כרומוזומים הומולוגיים','זוג כרומוזומים בעלי אותם גנים, אחד מהאם ואחד מהאב.'],tetrad:['טטרדה','שני כרומוזומים הומולוגיים משוכפלים יחד — ארבע כרומטידות.'],chiasma:['כיאזמה / Crossing-over','נקודת החלפת DNA בין כרומטידות לא־אחיות בפרופאזה I.'],cohesin:['Cohesin','קומפלקס חלבוני המחזיק כרומטידות אחיות יחד.'],separase:['Separase','אנזים המאפשר הפרדת כרומטידות באמצעות ביקוע cohesin.'],plate:['לוח המטאפאזה','המישור הדמיוני במרכז התא שבו הכרומוזומים מסתדרים.']};
const M=[['אחרי S — לפני מיטוזה','2n • DNA משוכפל','ה־DNA כבר שוכפל. כל כרומוזום מורכב משתי כרומטידות אחיות.','pre',['cell','nucleus','chromosome','chromatid','centromere','cohesin']],['Prophase','2n','הכרומוזומים מתעבים והצנטרוזומים מתחילים לארגן את כישור החלוקה.','pro',['cell','nucleus','chromosome','centrosome','microtubule','spindle']],['Prometaphase','2n','מעטפת הגרעין מתפרקת והמיקרוטובולים מתחברים לקינטוכורים.','attach',['chromosome','centromere','kinetochore','centrosome','microtubule','spindle']],['Metaphase','2n','הכרומוזומים מסתדרים במרכז התא ומחוברים לכישור משני הקטבים.','meta',['chromosome','kinetochore','centrosome','microtubule','spindle','plate']],['Anaphase','2n בכל קבוצה','הכרומטידות האחיות נפרדות ונעות לקטבים מנוגדים. מרגע שנפרדו, כל כרומטידה היא כרומוזום.','ana',['chromatid','centrosome','microtubule','spindle','cohesin','separase']],['Telophase + Cytokinesis','2 תאים • 2n','נוצרים שני גרעינים והתא מתחלק לשני תאי בת בעלי אותה פלואידיות כמו תא האם.','two',['cell','nucleus','chromosome']]];
const Q=[['אחרי S — לפני מיוזה I','2n • DNA משוכפל','שכפול DNA אחד מתרחש לפני מיוזה I. כל כרומוזום משוכפל, אך התא עדיין דיפלואידי.','pre',['cell','nucleus','chromosome','chromatid','centromere','cohesin']],['Prophase I','2n','הכרומוזומים ההומולוגיים נצמדים ונוצרת טטרדה. כאן יכול להתרחש crossing-over.','pair',['homolog','tetrad','chromatid','chiasma','cohesin','centromere']],['Metaphase I','2n','זוגות ההומולוגיים מסתדרים במרכז התא. האוריינטציה של כל זוג אקראית.','meta1',['homolog','centrosome','microtubule','spindle','plate','kinetochore']],['Anaphase I','2n → n','הכרומוזומים ההומולוגיים נפרדים, אבל הכרומטידות האחיות נשארות יחד.','ana1',['homolog','chromosome','centromere','cohesin','microtubule']],['Telophase I + Cytokinesis','2 תאים • n','נוצרים שני תאים הפלואידיים. הכרומוזומים עדיין משוכפלים ואין שכפול DNA נוסף.','twoX',['cell','chromosome','chromatid','centromere','cohesin']],['Metaphase II','n','בכל תא הכרומוזומים מסתדרים אחד־אחד במרכז, בדומה למיטוזה.','meta2',['chromosome','kinetochore','centrosome','microtubule','spindle','plate']],['Anaphase II','n','הכרומטידות האחיות נפרדות ונעות לקטבים מנוגדים.','ana2',['chromatid','centrosome','microtubule','spindle','cohesin','separase']],['Telophase II + Cytokinesis','4 תאים • n','מתקבלים ארבעה תאים הפלואידיים: שכפול DNA אחד ושתי חלוקות.','four',['cell','nucleus','chromosome']]];
let mode='M',index=0,selected=null;const E=(t,a={})=>{const e=document.createElementNS(NS,t);for(const[k,v]of Object.entries(a))e.setAttribute(k,v);return e};
function add(t,a={},key){const e=E(t,a);if(key){e.classList.add('clickable');e.dataset.key=key;e.setAttribute('tabindex','0');e.setAttribute('role','button');e.setAttribute('aria-label',info[key][0]);}svg.appendChild(e);return e}function line(x1,y1,x2,y2,cls='fiber',key='microtubule'){return add('line',{x1,y1,x2,y2,class:cls},key)}
function cell(cx=550,cy=310,rx=355,ry=235,key='cell'){return add('ellipse',{cx,cy,rx,ry,class:'cell'},key)}function nucleus(cx=550,cy=310,rx=225,ry=155){return add('ellipse',{cx,cy,rx,ry,class:'nucleus'},'nucleus')}
function pole(x,y){add('circle',{cx:x,cy:y,r:13,class:'pole'},'centrosome');for(let a=0;a<8;a++){let q=a*Math.PI/4;line(x+18*Math.cos(q),y+18*Math.sin(q),x+34*Math.cos(q),y+34*Math.sin(q),'fiber','centrosome')}}
function chr(x,y,k='A',s=1){const g=add('g',{transform:`translate(${x} ${y}) scale(${s})`},'chromosome');[['-18','-42','18','42'],['18','-42','-18','42']].forEach(v=>g.appendChild(E('line',{x1:v[0],y1:v[1],x2:v[2],y2:v[3],class:`chr chr${k}`})));let c=E('circle',{cx:0,cy:0,r:7,class:'centromere clickable','data-key':'centromere'});g.appendChild(c);return g}function rod(x,y,k='A',s=1){add('line',{x1:x,y1:y-40*s,x2:x,y2:y+40*s,class:`chr chr${k}`},'chromatid')}
function plate(x=550,y1=100,y2=520){line(x,y1,x,y2,'plate','plate')}function fibers(points,left=[215,310],right=[885,310]){pole(...left);pole(...right);points.forEach(([x,y])=>{line(left[0]+15,left[1],x,y);line(right[0]-15,right[1],x,y)})}
function label(text,x,y,tx,ty,key){add('text',{x,y,class:'label'},key).textContent=text;line(x+(x<tx?8:-8),y+7,tx,ty,'pointer',key)}function base(){while(svg.lastChild&&svg.lastChild.tagName!=='defs')svg.removeChild(svg.lastChild)}
function small(cx,cy,rx=185,ry=115){cell(cx,cy,rx,ry)}
function draw(type){base();if(type==='two'||type==='twoX'){small(320,310);small(780,310);[320,780].forEach((x,i)=>{add('ellipse',{cx:x,cy:310,rx:112,ry:75,class:'nucleus'},'nucleus');if(type==='two'){rod(x-25,310,'A');rod(x+25,310,'B')}else chr(x,310,i?'B':'A',.8)});label(type==='two'?'שני תאי בת דיפלואידיים':'שני תאים הפלואידיים',550,100,550,190,'cell');return}if(type==='four'){[[300,190],[800,190],[300,430],[800,430]].forEach((p,i)=>{small(p[0],p[1],160,85);add('ellipse',{cx:p[0],cy:p[1],rx:75,ry:48,class:'nucleus'},'nucleus');rod(p[0],p[1],i%2?'B':'A',.7)});label('ארבעה תאים הפלואידיים',550,50,550,100,'cell');return}if(type==='meta2'||type==='ana2'){[310,790].forEach((cx,i)=>{small(cx,310,220,180);let L=[cx-185,310],R=[cx+185,310];if(type==='meta2'){chr(cx,310,i?'B':'A',.8);line(cx,145,cx,475,'plate','plate');fibers([[cx,310]],L,R)}else{rod(cx-75,310,i?'B':'A',.75);rod(cx+75,310,i?'B':'A',.75);pole(...L);pole(...R);line(L[0]+15,310,cx-75,310);line(R[0]-15,310,cx+75,310)}});label(type==='meta2'?'יישור במרכז כל תא':'הפרדת כרומטידות אחיות',550,70,550,125,type==='meta2'?'plate':'chromatid');return}
cell();if(type==='pre'){nucleus();chr(500,270,'A');chr(600,350,'B');label('כרומוזום משוכפל',790,160,610,280,'chromosome');label('צנטרומר',820,250,600,350,'centromere');return}if(type==='pro'){nucleus();pole(250,310);pole(850,310);chr(500,270,'A');chr(600,350,'B');line(270,300,410,200);line(830,320,690,420);label('כישור מתחיל להיבנות',550,75,410,200,'spindle');return}if(type==='attach'){chr(500,245,'A');chr(610,370,'B');fibers([[500,245],[610,370]]);label('מיקרוטובול',555,90,420,260,'microtubule');label('קינטוכור',760,250,610,370,'kinetochore');return}if(type==='meta'){chr(550,220,'A',.85);chr(550,400,'B',.85);fibers([[550,220],[550,400]]);plate();label('לוח המטאפאזה',725,80,550,125,'plate');return}if(type==='ana'){pole(215,310);pole(885,310);[[365,230,'A'],[365,390,'B'],[735,230,'A'],[735,390,'B']].forEach(([x,y,k])=>{rod(x,y,k,.8);line(x<550?230:870,310,x,y)});label('כרומטידות שנפרדו',550,90,365,230,'chromatid');return}if(type==='pair'){nucleus();chr(525,310,'A');chr(575,310,'B');add('circle',{cx:550,cy:310,r:10,fill:'#dc2626'},'chiasma');label('טטרדה',760,150,575,265,'tetrad');label('כיאזמה',770,310,550,310,'chiasma');return}if(type==='meta1'){chr(525,310,'A');chr(575,310,'B');pole(215,310);pole(885,310);line(230,310,525,310);line(870,310,575,310);plate();label('זוג הומולוגיים',750,150,575,265,'homolog');return}if(type==='ana1'){chr(360,310,'A');chr(740,310,'B');pole(215,310);pole(885,310);line(230,310,360,310);line(870,310,740,310);label('ההומולוגיים נפרדים',550,110,740,265,'homolog')}}
function choose(k){selected=k;$('#selectedName').textContent=info[k][0];$('#selectedDesc').textContent=info[k][1];document.querySelectorAll('.chip').forEach(b=>b.classList.toggle('active',b.dataset.key===k))}
function render(){const arr=mode==='M'?M:Q,s=arr[index];$('#counter').textContent=`שלב ${index+1} מתוך ${arr.length}`;$('#stage').textContent=s[0];$('#ploidy').textContent=s[1];$('#explain').textContent=s[2];draw(s[3]);const box=$('#components');box.replaceChildren();s[4].forEach(k=>{let b=document.createElement('button');b.className='chip';b.dataset.key=k;b.textContent=info[k][0];b.onclick=()=>choose(k);box.appendChild(b)});$('#prev').disabled=index===0;$('#next').disabled=index===arr.length-1;const dots=$('#dots');dots.replaceChildren();arr.forEach((_,i)=>{let b=document.createElement('button');b.className='dot'+(i===index?' active':'');b.setAttribute('aria-label',`עבור לשלב ${i+1}`);b.onclick=()=>{index=i;selected=null;render()};dots.appendChild(b)});$('#mitosis').setAttribute('aria-pressed',mode==='M');$('#meiosis').setAttribute('aria-pressed',mode==='Q');if(selected&&s[4].includes(selected))choose(selected);else{$('#selectedName').textContent='—';$('#selectedDesc').textContent='לחצו על אחד הרכיבים.'}}
svg.addEventListener('click',e=>{let n=e.target.closest('[data-key]');if(n&&info[n.dataset.key])choose(n.dataset.key)});svg.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.dataset.key){e.preventDefault();choose(e.target.dataset.key)}});$('#mitosis').onclick=()=>{mode='M';index=0;selected=null;render()};$('#meiosis').onclick=()=>{mode='Q';index=0;selected=null;render()};$('#prev').onclick=()=>{if(index){index--;selected=null;render()}};$('#next').onclick=()=>{if(index<(mode==='M'?M:Q).length-1){index++;selected=null;render()}};document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')$('#next').click();if(e.key==='ArrowRight')$('#prev').click()});render();
})();
</script>
</body>
</html>
